<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Elevator Visual Controller</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- HTMX & p5.js CDNs -->
    <script src="https://unpkg.com/htmx.org@2.0.1/dist/htmx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header & Config Bar -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                        <path d="M9 6h6M9 10h6M9 14h6M9 18h6"></path>
                        <path d="M12 2v20"></path>
                    </svg>
                </div>
                <h1>Multi-Elevator Dispatch System</h1>
            </div>
            
            <form id="config-form" class="config-controls">
                <div class="input-group">
                    <label for="floors-input">Floors</label>
                    <input type="number" id="floors-input" name="floors" value="10" min="2" max="25" required>
                </div>
                <div class="input-group">
                    <label for="elevators-input">Elevators</label>
                    <input type="number" id="elevators-input" name="elevators" value="4" min="1" max="10" required>
                </div>
                <button type="submit" class="btn btn-primary">Apply & Reset</button>
            </form>
        </header>

        <main class="main-content">
            <!-- Left Side: Internal Cab Controllers (Fills Full Height) -->
            <section class="control-section">
                <div class="panel-card flex-full">
                    <div class="panel-header">
                        <h2>Internal Cab Keypads & Live Status</h2>
                        <span class="badge badge-live">Live</span>
                    </div>
                    <p class="panel-desc">Select destination floor inside specific elevator cab</p>
                    <div id="cab-keypads-container" class="cab-keypads">
                        <!-- Dynamic Elevator Keypads & Telemetry generated via JS -->
                    </div>
                </div>
            </section>

            <!-- Right Side: p5.js Visualizer + External Call Station Below -->
            <section class="canvas-section">
                <!-- p5.js Simulation Canvas -->
                <div class="canvas-wrapper">
                    <div class="canvas-header-bar">
                        <div class="header-status-title">
                            <span class="status-indicator"></span>
                            <span>p5.js Real-Time Engine</span>
                        </div>
                        <div id="telemetry-bar" class="telemetry-bar">
                            <!-- Telemetry Pills overlay -->
                        </div>
                    </div>
                    <div id="canvas-container"></div>
                </div>

                <!-- External Floor Call Station Below Canvas -->
                <div class="panel-card external-call-bottom">
                    <div class="panel-header">
                        <h2>External Call Station (Hall Buttons)</h2>
                        <span class="badge">Hall Call</span>
                    </div>
                    <div id="external-call-grid" class="floor-call-grid">
                        <!-- Dynamic Floor Buttons generated via JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
